baseURL = "https://unvertical.com/"
languageCode = "en"
title = "Unvertical — High-Performance Block Storage Caching"

[params]
  author = "Robert Bałdyga"  # default blog post author; override per post with author in front matter
  description = "Unvertical provides commercial support, consulting, and custom development for OpenCAS — the leading open-source block storage caching framework. Based in Poland, serving data centers worldwide."
  contactFormURL = "https://forms.formward.eu/f/800b284e-ac5b-43bb-99fa-55e9a63a614a"
  githubURL = "https://github.com/Open-CAS"
  opencasDocsURL = "https://open-cas.com"
  goatcounterURL = "https://analytics.cloud.unvertical.com/goatcounter"
  turnstileSiteKey = "0x4AAAAAAFFY6gG4pg5CrCFk"  # Cloudflare Turnstile site key; secret key goes in Formward form settings

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    lineNos = false
    guessSyntax = true

