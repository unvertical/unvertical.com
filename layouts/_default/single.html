{{ define "main" }}

<article class="blog-post">
  <div class="container blog-container">

    <header class="blog-post-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="blog-post-desc">{{ . }}</p>{{ end }}
    </header>

    <div class="blog-post-content">
      {{ .Content }}
    </div>

  </div>
</article>

{{ end }}
