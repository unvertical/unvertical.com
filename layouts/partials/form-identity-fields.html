{{- /* Name, email, country, company and job title rows shared by the lead forms */ -}}
        <div class="form-row">
          <div>
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first_name" placeholder="First name" autocomplete="given-name" required>
          </div>
          <div>
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last_name" placeholder="Last name" autocomplete="family-name" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="_replyto" placeholder="you@company.com" autocomplete="email" required>
          </div>
          <div>
            <label for="country">Country</label>
            <select id="country" name="country" autocomplete="country-name" required>
              <option value="" disabled selected>Select a country</option>
              {{ partial "country-options.html" . }}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="Your organization" autocomplete="organization" required>
          </div>
          <div>
            <label for="title">Job title</label>
            <input type="text" id="title" name="title" placeholder="Your role" autocomplete="organization-title">
          </div>
        </div>
