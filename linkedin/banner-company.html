<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1512px; height: 256px; overflow: hidden; background: #f7f8fa; }
  .banner { position: relative; width: 1512px; height: 256px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background:
    radial-gradient(ellipse 80% 60% at 70% 20%, rgba(78,205,196,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(78,205,196,0.03) 0%, transparent 70%); }
  .grid { position: absolute; inset: 0; background-image:
    linear-gradient(rgba(20,24,33,0.09) 2px, transparent 2px),
    linear-gradient(90deg, rgba(20,24,33,0.09) 2px, transparent 2px);
    background-size: 57px 57px;
    mask-image: radial-gradient(ellipse 70% 90% at 60% 45%, black 20%, transparent 75%); }
  h1 { position: absolute; left: 449px; top: 50%; transform: translateY(-50%);
    font-family: 'Source Serif 4', Georgia, serif; font-size: 55px; font-weight: 600;
    line-height: 1.1; letter-spacing: -1.9px; color: #141821; white-space: nowrap; text-align: center; }
  h1 em { font-style: italic; color: #17827b; }
</style></head>
<body><div class="banner"><div class="bg"></div><div class="grid"></div>
<h1>High-performance block storage <em>caching</em><br>for modern data centers</h1>
</div></body></html>
