<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #f7f8fa; }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background:
    radial-gradient(ellipse 80% 60% at 70% 20%, rgba(78,205,196,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(78,205,196,0.03) 0%, transparent 70%); }
  .grid { position: absolute; inset: 0; background-image:
    linear-gradient(rgba(20,24,33,0.09) 2px, transparent 2px),
    linear-gradient(90deg, rgba(20,24,33,0.09) 2px, transparent 2px);
    background-size: 66px 66px;
    mask-image: radial-gradient(ellipse 70% 90% at 60% 45%, black 20%, transparent 75%); }
  .content { position: absolute; left: 940px; top: 46%; transform: translate(-50%, -50%);
    text-align: center; white-space: nowrap; }
  .logo { font-family: 'JetBrains Mono', monospace; font-size: 52px; font-weight: 700;
    letter-spacing: -1.5px; color: #141821; margin-bottom: 26px; }
  .logo span { color: #17827b; }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: 58px; font-weight: 600;
    line-height: 1.1; letter-spacing: -2px; color: #141821; }
  h1 em { font-style: italic; color: #17827b; }
</style></head>
<body><div class="banner"><div class="bg"></div><div class="grid"></div>
<div class="content">
<div class="logo">un<span>vertical</span></div>
<h1>High-performance block storage <em>caching</em><br>for modern data centers</h1>
</div>
</div></body></html>
