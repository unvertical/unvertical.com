name: Trigger statichost.eu rebuild

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: statichost
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build
        env:
          STATICHOST_TOKEN: ${{ secrets.STATICHOST_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${STATICHOST_TOKEN}" \
            https://builder.statichost.eu/unvertical
